name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Git hooks are for people committing; the release bot's commits skip them
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@moa-eth'
      - run: pnpm install --frozen-lockfile
      # Opens a "Version packages" pull request from the changesets; when that is merged, publishes to GitHub Packages
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          # Conventional Commit wording, like every other commit and pull request in the repo
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
